  <text x="70" y="118" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">Hyeonjun Cho</text>
  <text x="72" y="165" fill="#7dd3fc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="600" letter-spacing="2">ROBOT LEARNING RESEARCHER</text>
  <text x="72" y="218" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Recovery under distribution shift · Vision-language planning · Real-robot systems</text>
  <rect x="72" y="250" width="116" height="4" rx="2" fill="url(#line)"/>
