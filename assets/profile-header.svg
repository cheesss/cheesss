<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Hyeonjun Cho — Robot Learning Researcher</title>
  <desc id="desc">A dark blue research banner with an abstract robot trajectory and the words Robot Learning, Recovery, and Vision-Language Planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d2138"/>
      <stop offset="1" stop-color="#102f46"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="54" r="160" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="920" cy="255" r="120" fill="#2dd4bf" opacity="0.06" filter="url(#soft)"/>

  <g opacity="0.13" stroke="#93c5fd" stroke-width="1">
    <path d="M760 0v320M840 0v320M920 0v320M1000 0v320M1080 0v320M1160 0v320"/>
    <path d="M720 64h480M720 128h480M720 192h480M720 256h480"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M752 234C810 218 824 164 865 156c48-10 62 54 109 43 48-12 38-94 92-107 35-8 62 16 95 1" stroke="#64748b" stroke-width="3" stroke-dasharray="7 10" opacity="0.55"/>
    <path d="M752 234C804 214 828 183 866 171c46-15 74 33 111 14 40-20 42-73 88-87 38-12 63 7 96-5" stroke="url(#line)" stroke-width="5"/>
    <circle cx="752" cy="234" r="8" fill="#38bdf8"/>
    <circle cx="866" cy="171" r="8" fill="#67e8f9"/>
    <circle cx="977" cy="185" r="8" fill="#5eead4"/>
    <circle cx="1065" cy="98" r="8" fill="#2dd4bf"/>
    <circle cx="1161" cy="93" r="8" fill="#99f6e4"/>
  </g>

  <g transform="translate(840 86)" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M0 62l42-26 40 27 39-48"/>
    <circle cx="0" cy="62" r="9" fill="#0d2138"/>
    <circle cx="42" cy="36" r="9" fill="#0d2138"/>
    <circle cx="82" cy="63" r="9" fill="#0d2138"/>
    <circle cx="121" cy="15" r="9" fill="#0d2138"/>
    <path d="M121 15l30-5m-30 5 13 28"/>
